name: Android CI and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint, and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: woku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Restore release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.WOKU_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/woku-release.p12"
          chmod 600 "$RUNNER_TEMP/woku-release.p12"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          WOKU_KEYSTORE_PATH: ${{ runner.temp }}/woku-release.p12
          WOKU_KEYSTORE_PASSWORD: ${{ secrets.WOKU_KEYSTORE_PASSWORD }}
          WOKU_KEY_ALIAS: ${{ secrets.WOKU_KEY_ALIAS }}
          WOKU_KEY_PASSWORD: ${{ secrets.WOKU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$WOKU_KEYSTORE_PASSWORD"
          test -n "$WOKU_KEY_ALIAS"
          test -n "$WOKU_KEY_PASSWORD"
          test "$GITHUB_REF_NAME" = "v$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: woku-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: woku-signed-release-apk
          path: dist
      - name: Publish signed APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv dist/app-release.apk "dist/woku-sudoku-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum "woku-sudoku-${GITHUB_REF_NAME}.apk" > SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Woku Sudoku ${GITHUB_REF_NAME}" --generate-notes
          fi
